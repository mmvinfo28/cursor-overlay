<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden; }

  #buddy {
    position:fixed; left:0; top:0; width:0; height:0;
    transform:translate(-50%,-50%); pointer-events:none; opacity:0;
  }
  #buddy.detected {
    width:34px; height:34px; border:2px solid #E9A23B; border-radius:50%;
    background:rgba(233,162,59,.08);
    animation:signal-pulse .7s ease-out both;
  }
  body.select #buddy {
    width:58px; height:58px; opacity:1;
    animation:pop .45s cubic-bezier(.36,.07,.19,.97) both, breathe 1.6s ease-in-out .45s infinite;
  }
  #buddy .corner {
    position:absolute; display:none; width:15px; height:15px;
    border-color:#E9A23B; border-style:solid;
  }
  body.select #buddy .corner { display:block; }
  #buddy .tl { left:0; top:0; border-width:2.5px 0 0 2.5px; }
  #buddy .tr { right:0; top:0; border-width:2.5px 2.5px 0 0; }
  #buddy .bl { left:0; bottom:0; border-width:0 0 2.5px 2.5px; }
  #buddy .br { right:0; bottom:0; border-width:0 2.5px 2.5px 0; }
  #buddy.hit {
    width:46px; height:46px; opacity:1; border:2px solid #6EE08A; border-radius:50%;
    background:rgba(90,200,120,.16);
    animation:capture-pop .3s cubic-bezier(.34,1.6,.64,1) both;
  }
  #buddy.hit .corner { display:none; }
  #buddy.hit::after {
    content:'✓'; position:absolute; inset:0; display:grid; place-items:center;
    color:#6EE08A; font:600 23px/1 system-ui, Segoe UI, sans-serif;
  }
  @keyframes signal-pulse {
    0%   { transform:translate(-50%,-50%) scale(.55); opacity:0; }
    28%  { transform:translate(-50%,-50%) scale(1); opacity:.92; }
    100% { transform:translate(-50%,-50%) scale(1.65); opacity:0; }
  }
  @keyframes pop {
    0%   { transform:translate(-50%,-50%) scale(.55); opacity:0; }
    55%  { transform:translate(-50%,-50%) scale(1.12); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1); opacity:1; }
  }
  @keyframes capture-pop {
    0%   { transform:translate(-50%,-50%) scale(.55); opacity:0; }
    60%  { transform:translate(-50%,-50%) scale(1.12); opacity:1; }
    100% { transform:translate(-50%,-50%) scale(1); opacity:1; }
  }
  @keyframes breathe { 50% { filter:drop-shadow(0 0 5px rgba(233,162,59,.65)); } }

  /* selection mode: dimmed screen, crosshair, dragged rectangle stays clear */
  body.select { cursor:crosshair; }
  #dim { position:fixed; inset:0; background:rgba(0,0,0,.28); display:none; }
  body.select #dim { display:block; }
  #sel {
    position:fixed; display:none; pointer-events:none;
    border:2px solid #E9A23B; background:rgba(233,162,59,.08);
    box-shadow:0 0 0 9999px rgba(0,0,0,.28);
  }
  body.dragging #dim { display:none; }
  body.dragging #sel { display:block; }

  /* toast: captured text shown next to the cursor for a few seconds */
  #toast {
    position:fixed; max-width:360px; max-height:170px; overflow:hidden; box-sizing:border-box;
    padding:10px 12px; border-radius:10px; border:1.5px solid #E9A23B;
    background:rgba(24,24,24,.94); color:#eee; box-shadow:0 6px 24px rgba(0,0,0,.35);
    font:13px/1.4 system-ui, Segoe UI, sans-serif; white-space:pre-wrap; word-break:break-word;
    pointer-events:none; opacity:0; transform:scale(.85); transform-origin:top left;
    transition:opacity .25s, transform .45s cubic-bezier(.34,1.6,.64,1);
  }
  #toast.on { opacity:1; transform:scale(1); }

  /* reader panel: live view of the focused field + local-filter verdict (test surface, --reader) */
  #panel {
    position:fixed; left:16px; top:16px; width:400px; box-sizing:border-box;
    border-radius:12px; border:1px solid #333; background:rgba(20,20,22,.95);
    color:#ddd; font:12px/1.45 system-ui, Segoe UI, sans-serif;
    box-shadow:0 8px 30px rgba(0,0,0,.4); pointer-events:none; display:none; overflow:hidden;
  }
  body.reader #panel { display:block; }
  #panel .hd { display:flex; align-items:center; gap:8px; padding:9px 12px; border-bottom:1px solid #2a2a2a; }
  #panel .app { font-weight:600; color:#fff; }
  #panel .meta { color:#888; font-size:11px; }
  #panel .badge { margin-left:auto; padding:2px 9px; border-radius:999px; font-size:11px; font-weight:600; }
  #panel .badge.silent { background:#2a2a2a; color:#999; }
  #panel .badge.pass { background:rgba(90,200,120,.18); color:#6ee08a; border:1px solid rgba(90,200,120,.4); }
  #panel .sig { padding:6px 12px 0; display:flex; flex-wrap:wrap; gap:5px; }
  #panel .sig span { padding:1px 7px; border-radius:6px; background:rgba(233,162,59,.15); color:#E9A23B; font-size:11px; }
  #panel .sig span.weak { background:#2a2a2a; color:#888; }
  #panel .txt {
    margin:8px 12px 12px; padding:8px 10px; max-height:120px; overflow:hidden;
    border-radius:8px; background:#111; border:1px solid #262626; color:#cfcfcf;
    font:12px/1.4 ui-monospace, Consolas, monospace; white-space:pre-wrap; word-break:break-word;
  }
  #panel .txt:empty::before { content:'(no text read)'; color:#666; }
  #panel.flash { border-color:#E9A23B; }

  body.hidden-ui #buddy, body.hidden-ui #dim, body.hidden-ui #sel, body.hidden-ui #toast, body.hidden-ui #panel { visibility:hidden; }
</style></head>
<body>
  <div id="dim"></div>
  <div id="sel"></div>
  <div id="buddy">
    <span class="corner tl"></span>
    <span class="corner tr"></span>
    <span class="corner bl"></span>
    <span class="corner br"></span>
  </div>
  <div id="toast"></div>
  <div id="panel">
    <div class="hd">
      <span class="app" id="p-app">—</span>
      <span class="meta" id="p-meta"></span>
      <span class="badge silent" id="p-badge">silent</span>
    </div>
    <div class="sig" id="p-sig"></div>
    <div class="txt" id="p-txt"></div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const body = document.body;
    const buddy = document.getElementById('buddy');
    const sel = document.getElementById('sel');
    const toast = document.getElementById('toast');

    const STIFFNESS = 0.22, DAMPING = 0.68;
    let cursor = { x: -100, y: -100 };
    let pos = { x: -100, y: -100 }, vel = { x: 0, y: 0 };

    ipcRenderer.on('cursor', (_, p) => { cursor = p; });

    (function tick() {
      vel.x = (vel.x + (cursor.x - pos.x) * STIFFNESS) * DAMPING;
      vel.y = (vel.y + (cursor.y - pos.y) * STIFFNESS) * DAMPING;
      pos.x += vel.x; pos.y += vel.y;
      buddy.style.left = pos.x + 'px';
      buddy.style.top  = pos.y + 'px';
      requestAnimationFrame(tick);
    })();

    let start = null;
    ipcRenderer.on('select-start', () => {
      clearTimeout(detectionDelay);
      clearTimeout(detectionVisible);
      buddy.classList.remove('detected', 'hit');
      body.classList.add('select');
    });
    ipcRenderer.on('select-end', () => { body.classList.remove('select', 'dragging'); start = null; });

    function rectFrom(e) {
      return {
        x: Math.min(start.x, e.clientX), y: Math.min(start.y, e.clientY),
        w: Math.abs(e.clientX - start.x), h: Math.abs(e.clientY - start.y)
      };
    }
    window.addEventListener('mousedown', e => {
      if (!body.classList.contains('select')) return;
      if (e.button !== 0) { ipcRenderer.send('cancel'); return; }
      start = { x: e.clientX, y: e.clientY };
    });
    window.addEventListener('mousemove', e => {
      if (!start) return;
      const r = rectFrom(e);
      Object.assign(sel.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px' });
      body.classList.add('dragging');
    });
    window.addEventListener('mouseup', e => {
      if (!start || e.button !== 0) return;
      ipcRenderer.send('region', rectFrom(e));
      start = null;
    });
    window.addEventListener('contextmenu', e => e.preventDefault());

    ipcRenderer.on('hide', () => {
      body.classList.add('hidden-ui');
      requestAnimationFrame(() => requestAnimationFrame(() => ipcRenderer.send('hidden')));
    });
    ipcRenderer.on('show', () => body.classList.remove('hidden-ui'));
    // captured text next to the cursor, kept inside the screen, gone after 3.5s
    let toastTimer = null;
    ipcRenderer.on('toast', (_, { text, x, y }) => {
      toast.textContent = text.length > 400 ? text.slice(0, 400) + '…' : text;
      toast.style.left = '0px'; toast.style.top = '0px';
      const w = toast.offsetWidth, h = toast.offsetHeight;
      toast.style.left = Math.max(8, Math.min(x + 24, innerWidth  - w - 8)) + 'px';
      toast.style.top  = Math.max(8, Math.min(y + 24, innerHeight - h - 8)) + 'px';
      toast.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('on'), 3500);
    });

    let hitTimer = null;
    ipcRenderer.on('fired', () => {
      buddy.classList.remove('detected', 'hit');
      void buddy.offsetWidth;
      buddy.classList.add('hit');
      clearTimeout(hitTimer);
      hitTimer = setTimeout(() => buddy.classList.remove('hit'), 300);
    });

    // reader panel: live focused-field text + local-filter verdict
    const panel = document.getElementById('panel');
    const pApp = document.getElementById('p-app');
    const pMeta = document.getElementById('p-meta');
    const pBadge = document.getElementById('p-badge');
    const pSig = document.getElementById('p-sig');
    const pTxt = document.getElementById('p-txt');
    let flashTimer = null;
    ipcRenderer.on('field-hide', () => body.classList.remove('reader'));
    let detectionDelay = null;
    let detectionVisible = null;
    let detectionGeneration = 0;
    ipcRenderer.on('signal', (_, { pass }) => {
      clearTimeout(detectionDelay);
      detectionGeneration++;
      if (!pass) {
        clearTimeout(detectionVisible);
        buddy.classList.remove('detected');
        return;
      }
      const generation = detectionGeneration;
      detectionDelay = setTimeout(() => {
        if (generation !== detectionGeneration || body.classList.contains('select')) return;
        buddy.classList.remove('detected');
        void buddy.offsetWidth;
        buddy.classList.add('detected');
        clearTimeout(detectionVisible);
        detectionVisible = setTimeout(() => buddy.classList.remove('detected'), 700);
      }, 650);
    });
    ipcRenderer.on('field', (_, f) => {
      body.classList.add('reader');
      pApp.textContent = f.app || '?';
      pMeta.textContent = `${f.type} · ${f.src} · ${f.len} ch`;
      pBadge.textContent = f.pass ? 'would call model' : 'silent';
      pBadge.className = 'badge ' + (f.pass ? 'pass' : 'silent');
      pSig.innerHTML = '';
      (f.signals || []).forEach(s => {
        const el = document.createElement('span');
        el.textContent = s;
        if (s === 'number?') el.className = 'weak';
        pSig.appendChild(el);
      });
      const t = f.text || '';
      pTxt.textContent = t.length > 300 ? '…' + t.slice(-300) : t;
      panel.classList.add('flash');
      clearTimeout(flashTimer);
      flashTimer = setTimeout(() => panel.classList.remove('flash'), 180);
    });
  </script>
</body>
</html>

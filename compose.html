<!doctype html>
<html>
<head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<style>
  body { background: transparent; }
  body.file-drag::after { content:'Drop files to attach'; position:fixed; inset:6px; z-index:100; display:grid; place-items:center; border:2px dashed var(--amber); border-radius:12px; background:rgba(15,15,17,.94); color:var(--amber-2); font-size:17px; font-weight:600; pointer-events:none; }
  #wrap { display:flex; flex-direction:column; height:100%; border:1px solid rgba(233,162,59,.6); border-radius:14px; overflow:hidden;
          background: radial-gradient(500px 220px at 20% -10%, rgba(233,162,59,.12), transparent 60%), var(--panel); box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  #hd { padding:9px 12px; }
  #hd h1 { font-size:12.5px; }
  #hd .app { color:var(--dim); font-size:11px; }
  #hd button { margin-left:auto; }
  #body { padding:10px 12px; display:flex; flex-direction:column; gap:8px; flex:1; min-height:0; }
  input, textarea { resize:none; }
  #title { font-weight:600; }
  #ctx { flex:1; min-height:70px; line-height:1.5; }
  .lbl { font-size:10.5px; color:var(--dim); margin-bottom:-4px; letter-spacing:.04em; text-transform:uppercase; }
  #srcs { display:flex; flex-wrap:wrap; gap:5px; }
  #srcs button { background:#121214; border:1px solid var(--line); color:#dcdce0; padding:4px 10px; border-radius:.55rem; font:inherit; font-size:12px; cursor:pointer; transition:border-color .15s, background .15s; }
  #srcs button:hover { border-color:var(--amber); background:#17171a; }
  #att { display:flex; flex-wrap:wrap; gap:5px; max-height:76px; overflow:auto; flex-shrink:0; }
  #att:empty { display:none; }
  #error { color:#f29b91; font-size:12px; max-height:44px; overflow:auto; }
  #error:empty { display:none; }
  .chip { cursor:default; }
  .chip span { max-width:180px; }
  #ft { display:flex; align-items:center; gap:8px; padding:8px 12px; border-top:1px solid var(--line); background:rgba(15,15,17,.5); }
  #ft .hint { color:var(--dim); font-size:11px; }
  #ft .sp { flex:1; }
</style></head>
<body>
<div id="wrap">
  <div id="hd" class="win-hd"><span class="ring"></span><h1>Create a task</h1><span class="app" id="app"></span><button id="close" class="ghost" title="Esc">✕</button></div>
  <div id="body">
    <input id="title" class="input" placeholder="What should the crew do?" />
    <div class="lbl">Context</div>
    <textarea id="ctx" class="input" placeholder="What the crew needs to know…"></textarea>
    <div class="lbl">Drop files here, or add context from</div>
    <div id="srcs">
      <button data-k="file">📎 File</button>
      <button data-k="folder">🗂 Folder</button>
      <button data-k="region">✂ Screen region</button>
      <button data-k="cursor">📷 Around cursor</button>
      <button data-k="clipboard">📋 Clipboard</button>
      <button data-k="field">🪟 This field</button>
      <button data-k="link">🔗 Link</button>
    </div>
    <div id="att"></div>
    <div id="error" role="alert"></div>
  </div>
  <div id="ft"><span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> or <kbd>⇧⇧</kbd> send · <kbd>Esc</kbd> cancel</span><span class="sp"></span><button id="cancel" class="btn">Cancel</button><button id="send" class="btn-primary">Send to crew</button></div>
</div>
<script>
  const { ipcRenderer } = require('electron');
  const $ = id => document.getElementById(id);
  let attachments = [];      // { id, name, mime, size, base64?, url?, thumb? }
  let seq = 0;
  let busy = false, sending = false;
  const esc = value => String(value ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const showError = error => { $('error').textContent = error.message || String(error); };
  function syncButtons() {
    $('send').disabled = busy || sending;
    $('send').textContent = sending ? 'Sending…' : busy ? 'Adding files…' : 'Send to crew';
    $('cancel').disabled = $('close').disabled = sending;
    $('title').disabled = $('ctx').disabled = sending;
    document.querySelectorAll('#srcs button').forEach(button => { button.disabled = sending; });
  }
  require('./file-drop').installFileDrop(document, paths => {
    if (sending) return;
    return ipcRenderer.invoke('compose-files', paths);
  }, showError);

  function renderAtt() {
    $('att').innerHTML = '';
    for (const a of attachments) {
      const el = document.createElement('span');
      el.className = 'chip';
      el.innerHTML = `${a.thumb ? `<img src="${esc(a.thumb)}">` : a.mime && a.mime.startsWith('image/') ? '🖼' : a.kind === 'link' ? '🔗' : a.kind === 'folder' ? '🗂' : '📎'} <span title="${esc(a.name)}">${esc(a.name)}</span>${a.size ? `<b>${(a.size / 1024).toFixed(0)} KB</b>` : ''}<span class="x" title="remove">✕</span>`;
      el.querySelector('.x').onclick = () => { if (sending) return; attachments = attachments.filter(x => x.id !== a.id); renderAtt(); };
      $('att').appendChild(el);
    }
  }

  let initialTitle = '';
  ipcRenderer.on('compose-open', (_, p) => {
    attachments = [];
    busy = sending = false;
    $('error').textContent = '';
    initialTitle = p.title || '';
    $('title').value = p.title || '';
    $('ctx').value = p.context || '';
    $('app').textContent = p.app ? 'from ' + p.app : '';
    if (p.crop) attachments.push({ id: ++seq, name: 'cursor-crop.png', mime: 'image/png', size: p.crop.size, base64: p.crop.base64, thumb: 'data:image/png;base64,' + p.crop.base64 });
    renderAtt();
    syncButtons();
    ($('title').value ? $('ctx') : $('title')).focus();
  });

  // the model answered after the composer opened: swap in its title unless the user already edited it
  ipcRenderer.on('compose-title', (_, { title }) => {
    if ($('title').value === initialTitle) { $('title').value = title; initialTitle = title; }
  });

  // main.js answers add requests with one of: {text} appended to context, or an attachment
  ipcRenderer.on('compose-attach', (_, a) => {
    if (a.text) { const c = $('ctx'); c.value = (c.value.trim() ? c.value.trimEnd() + '\n\n' : '') + a.text; c.focus(); return; }
    if (a.localPath && attachments.some(item => item.localPath === a.localPath)) return;
    if (attachments.length >= 20) return showError('A task can contain at most 20 attachments.');
    attachments.push({ id: ++seq, ...a, thumb: a.mime && a.mime.startsWith('image/') && a.base64 ? 'data:' + a.mime + ';base64,' + a.base64 : null });
    renderAtt();
  });
  ipcRenderer.on('compose-busy', (_, value) => { busy = value; syncButtons(); });
  ipcRenderer.on('compose-error', (_, message) => { sending = false; showError(message); syncButtons(); });

  $('srcs').addEventListener('click', e => {
    const k = e.target.closest('button') && e.target.closest('button').dataset.k;
    if (!k) return;
    if (k === 'link') {
      const url = prompt('Link to include:');
      if (url && url.trim()) { attachments.push({ id: ++seq, kind: 'link', name: url.trim(), url: url.trim() }); renderAtt(); }
      return;
    }
    ipcRenderer.send('compose-add', k);
  });

  function send() {
    if (busy || sending) return;
    const title = $('title').value.trim();
    if (!title) return $('title').focus();
    sending = true; $('error').textContent = ''; syncButtons();
    ipcRenderer.send('compose-send', { title, context: $('ctx').value.trim(), attachments: attachments.map(({ thumb, id, localPath, ...a }) => a) });
  }
  ipcRenderer.on('compose-send-now', send);
  $('send').onclick = send;
  $('cancel').onclick = () => ipcRenderer.send('compose-cancel');
  $('close').onclick = () => ipcRenderer.send('compose-cancel');
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !sending) ipcRenderer.send('compose-cancel');
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) send();
    if (e.key === 'Enter' && e.target.id === 'title') { e.preventDefault(); $('ctx').focus(); }
  });
</script>
</body>
</html>
